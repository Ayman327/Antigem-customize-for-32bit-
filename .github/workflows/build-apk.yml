name: Build 32-bit & 64-bit APKs

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '^1.26'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android NDK
        run: |
          SDKMANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Make gradlew executable
        run: chmod +x gradlew scripts/*.sh

      - name: Build Termux & TermuxShared Debug APKs (32-bit + 64-bit)
        run: ./gradlew :app:assembleTermuxDebug :app:assembleTermuxSharedDebug

      - name: Upload Built APKs as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AntiGem-32bit-APKs
          path: |
            app/build/outputs/apk/termux/debug/*.apk
            app/build/outputs/apk/termuxShared/debug/*.apk
